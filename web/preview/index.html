<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DBNest · 库巢 · 数据库管理工具</title>
<link rel="icon" type="image/png" href="./favicon.png" />
<script>
// 资源路径兼容：HTTP 模式页面在 /(资源在 /preview/)→ 加 base;file:// 桌面模式不加(相对文件目录)
// 相对引用 ./vendor/...、../src/lib/... 在两种模式下均正确解析
(function () {
  if (location.protocol !== 'file:') {
    var _b = document.createElement('base');
    _b.href = '/preview/';
    document.head.appendChild(_b);
  }
})();
</script>
<!-- CodeMirror 5（本地伺服，稳定编辑器） -->
<link rel="stylesheet" href="./vendor/codemirror/codemirror.css" />
<link rel="stylesheet" href="./vendor/codemirror/hint/show-hint.min.css" />
<script src="../src/lib/db-logic.js"></script>
<script src="../src/lib/ui-interactions.js"></script>
<script src="./db-logos.js"></script>
<script src="./vendor/codemirror/codemirror.js"></script>
<script src="./vendor/codemirror/sql.min.js"></script>
<script src="./vendor/codemirror/hint/show-hint.min.js"></script>
<script src="./vendor/codemirror/hint/sql-hint.min.js"></script>
<script src="./vendor/codemirror/search/search.min.js"></script>
<script src="./vendor/codemirror/search/searchcursor.min.js"></script>
<script src="./vendor/codemirror/edit/matchbrackets.min.js"></script>
<script src="./vendor/codemirror/edit/closebrackets.min.js"></script>
<style>
/* ===================== 主题变量 ===================== */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel-2:#f7f8fa; --border:#dbe0e6; --border-2:#cdd3da;
  --text:#23272e; --muted:#7c8693; --faint:#aab2bd;
  --accent:#2f7ce0; --accent-d:#1f5fb8; --accent-soft:#e7f0fc;
  --danger:#df4040; --danger-soft:#fdecec; --warn:#d99100; --ok:#2f9e54; --ok-soft:#e7f6ec;
  --null:#b3bac4; --row-alt:#f6f8fb; --sel:#d6e6fb; --sel-soft:#eaf2fd;
  --head:#f0f2f5; --head-2:#e9edf2; --bar:#e7eaef; --bar-2:#dfe3ea;
  --grid-line:#eceef2; --pk:#fff6e0; --shadow:0 10px 30px rgba(20,30,50,.16);
  --h-kw:#7c3aed; --h-str:#12813d; --h-num:#b45309; --h-cmt:#8a919c; --h-fn:#1d5fd6;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
}
html[data-theme="dark"]{
  --bg:#17191e; --panel:#21242b; --panel-2:#1b1e24; --border:#33384a; --border-2:#3c4255;
  --text:#dde1e9; --muted:#9aa3b2; --faint:#6b7383;
  --accent:#4c8dff; --accent-d:#6ea2ff; --accent-soft:#23314a;
  --danger:#ff6b6b; --danger-soft:#3a2424; --warn:#e6a23c; --ok:#46c46b; --ok-soft:#1e3326;
  --null:#6b7383; --row-alt:#1f222a; --sel:#2d4a78; --sel-soft:#22324c;
  --head:#262a33; --head-2:#2c313c; --bar:#1d2027; --bar-2:#262a33;
  --grid-line:#2a2e38; --pk:#3a3115; --shadow:0 10px 34px rgba(0,0,0,.5);
  --h-kw:#c678dd; --h-str:#98c379; --h-num:#e5c07b; --h-cmt:#7f848e; --h-fn:#61afef;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
button{font-family:inherit;}
/* SVG 图标统一规格：16x16 viewBox,1.5 描边,currentColor 继承父元素色,双色节点图标为主色 */
.ic{width:14px;height:14px;vertical-align:-2px;margin-right:3px;flex:none;display:inline-block;}
.ic-on{color:var(--accent);}
.ic-muted{color:var(--muted);}
.ic-warn{color:var(--warn);}
.ic-ok{color:var(--ok);}
/* 树节点图标:左色块 + 主色描边,提升识别度 */
.node .ico-db{background:var(--accent-soft);color:var(--accent-d);width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:none;}
.node .ico-sch{background:#f0f6fd;color:#5878b3;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:none;}
.node .ico-tbl{background:#e7f6ec;color:#2f9e54;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:none;font-family:var(--mono);}
.node .ico-view{background:#fdf3e6;color:#b87800;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:none;font-family:var(--mono);}
.node .ico-fn{background:#eef0fb;color:#6a5ae0;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:none;}
.node .ico-seq{background:#f2f7ff;color:#2f7ce0;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:none;}
.node .ico-conn{background:var(--bar);color:var(--accent);width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;flex:none;}
/* 数据库类型品牌徽章（连接节点/已保存连接） */
.brand-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;font-size:10px;font-weight:600;flex:none;margin-right:8px;letter-spacing:.3px;}
.brand-badge.brand-logo{background:transparent;border:none;border-radius:5px;width:28px;height:28px;padding:0;}
.brand-badge.brand-logo .ic{width:100%;height:100%;display:block;margin:0;}
.brand-badge.brand-emoji{background:transparent;border:none;width:auto;height:auto;font-size:20px;line-height:1;margin-right:8px;}

/* ===================== 顶栏 ===================== */
.topbar{height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(180deg,var(--accent),var(--accent-d));color:#fff;}
/* 全局加载进度条：顶部 2px 细条 + 流动动画 */
.loadbar{position:absolute;top:0;left:0;right:0;height:2px;z-index:999;pointer-events:none;opacity:0;transition:opacity .15s;overflow:hidden;}
.loadbar.on{opacity:1;}
.loadbar::before{content:'';display:block;height:100%;width:35%;border-radius:2px;background:linear-gradient(90deg,transparent,#7cf29a,#4fd1ff,transparent);animation:loadflow 1.1s linear infinite;}
@keyframes loadflow{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
.topbar .logo{font-weight:700;font-size:14px;letter-spacing:.3px;display:flex;align-items:center;gap:7px;}
.topbar .logo .dot{width:9px;height:9px;border-radius:50%;background:#7cf29a;box-shadow:0 0 6px #7cf29a;}
.topbar .sp{flex:1;}
.topbar .tbtn{background:rgba(255,255,255,.14);border:0;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;}
.topbar .tbtn:hover{background:rgba(255,255,255,.26);}

/* 菜单栏 */
.menubar{background:var(--bar);border-bottom:1px solid var(--border);display:flex;gap:1px;padding:1px 4px;}
.menubar .mi{padding:4px 11px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text);}
.menubar .mi:hover{background:var(--accent-soft);color:var(--accent-d);}

/* 工具栏 */
.toolbar{background:var(--panel);border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;padding:7px 10px;flex-wrap:wrap;}
.btn{border:1px solid var(--border-2);background:var(--panel);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--text);}
.btn:hover{border-color:var(--accent);color:var(--accent-d);background:var(--sel-soft);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:var(--accent-d);color:#fff;}
.btn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.icon{padding:5px 8px;}
.sep{width:1px;height:20px;background:var(--border-2);margin:0 3px;}
.hint{font-size:11.5px;color:var(--muted);}
.toolbar .grow{flex:1;}

/* ===================== 布局 ===================== */
.layout{flex:1;display:flex;min-height:0;}
.left{width:286px;flex:none;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0;}
.left .lf{display:flex;gap:5px;padding:7px;border-bottom:1px solid var(--border);}
.left .lf input{flex:1;padding:5px 9px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--text);}
.left .lf input:focus{outline:none;border-color:var(--accent);}
.tree{flex:1;overflow:auto;padding:5px 4px 14px;}
.node{padding:3px 7px;border-radius:5px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--text);}
.node.conn{font-weight:700;padding:5px 7px;margin:2px 0;background:var(--panel-2);border-radius:6px;}
.node.conn:hover{background:var(--sel-soft);}
.node.conn.sel{background:var(--sel);color:var(--accent-d);}
.node.conn-offline{opacity:.72;border:1px dashed var(--border-2);cursor:pointer;}
.node.conn-offline .offline-tag{font-size:10px;color:var(--muted);background:var(--panel);border:1px solid var(--border-2);border-radius:8px;padding:0 5px;margin-left:4px;font-weight:400;}
.node:hover{background:var(--sel-soft);}
.node.sel{background:var(--sel);color:var(--accent-d);font-weight:600;}
.node .ico{display:inline-block;width:18px;text-align:center;flex:none;font-size:12px;}
.caret{width:14px;color:var(--muted);cursor:pointer;flex:none;text-align:center;font-size:10px;transition:transform .1s;}
.caret.open{transform:rotate(90deg);}
/* 树形引导线：层级连接线 + 缩进，形成明显树结构（左侧树与对象面板共用） */
.children{padding-left:16px;position:relative;border-left:1px dotted var(--border-2);margin-left:8px;}
.children:hover{border-left-color:var(--border);}
.node{padding:3px 7px;border-radius:5px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--text);}
.node .lbl{overflow:hidden;text-overflow:ellipsis;}
.node .lbl .cnt{color:var(--faint);font-size:11px;font-style:normal;}
.node > .caret{margin-right:1px;}
.node.db-node > .caret,.node.sc-node > .caret{position:relative;}
.node .ico{display:inline-block;width:18px;text-align:center;flex:none;font-size:12px;}
.grp{font-size:11px;color:var(--muted);font-weight:600;padding:7px 7px 2px;letter-spacing:.4px;text-transform:uppercase;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}

/* Tab 栏 */
.tabbar{display:flex;background:var(--bar);border-bottom:1px solid var(--border);overflow-x:auto;flex:none;}
.tab{padding:8px 12px;border-right:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap;color:var(--text);}
.tab:hover{background:var(--panel-2);}
.tab.on{background:var(--panel);box-shadow:inset 0 2px 0 var(--accent);font-weight:600;}
.tab .x{color:var(--faint);border-radius:3px;padding:0 4px;font-size:11px;}
.tab .x:hover{background:var(--danger);color:#fff;}
/* 固定「对象」页签（不可关闭）+ 对象导航面板 */
.tabbar .tab.obj-tab{background:rgba(127,140,255,.14);color:var(--accent);font-weight:600;}
.tabbar .tab.obj-tab:hover{background:rgba(127,140,255,.22);}
.obj-panel{height:100%;display:flex;flex-direction:column;}
.obj-panel-head{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);}
.obj-panel-head b{display:flex;align-items:center;gap:6px;font-size:13px;}
.obj-panel-head .btn{padding:3px 10px;font-size:12px;}
/* 对象类型筛选按钮组 */
.obj-filter{display:inline-flex;gap:2px;background:var(--panel-2);border:1px solid var(--border-2);border-radius:7px;padding:2px;}
.obj-filter .of{padding:3px 10px;font-size:12px;border:none;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer;}
.obj-filter .of:hover{color:var(--text);}
.obj-filter .of.on{background:var(--accent);color:#fff;font-weight:600;}
.obj-panel-tree{flex:1;min-height:0;overflow:auto;padding:6px 4px;}
.obj-panel-tree .tree{height:auto;}
.obj-panel-info{flex:none;padding:6px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);}

/* Navicat 风格对象 Tab */
.obj-nav{flex:1;min-height:0;display:flex;flex-direction:column;}
.obj-header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.obj-header .obj-logo{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;}
.obj-header .obj-logo svg{width:100%;height:100%;}
.obj-header .obj-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;}
.obj-header .obj-name .obj-path{color:var(--muted);font-weight:400;font-size:12px;}
.obj-header .obj-meta{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:10px;}
.obj-db-bar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--border);background:var(--panel);font-size:12px;}
.obj-db-bar .qdb-sel{flex:1;max-width:260px;padding:4px 8px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--text);}
.obj-db-bar .qdb-sel:focus{outline:none;border-color:var(--accent);}
.obj-typebar{flex:none;display:flex;gap:2px;padding:5px 10px;border-bottom:1px solid var(--border);background:var(--panel);}
.obj-typebar .ot{padding:4px 12px;font-size:12px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;}
.obj-typebar .ot:hover{color:var(--text);background:var(--hover);}
.obj-typebar .ot.on{background:var(--accent-soft);color:var(--accent-d);border-color:var(--accent);font-weight:600;}
.obj-typebar .ot .cnt{font-size:10px;color:var(--faint);margin-left:3px;}
.obj-toolbar{flex:none;display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--border);background:var(--panel);}
.obj-toolbar .icon-btn{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:14px;}
.obj-toolbar .icon-btn:hover{background:var(--hover);color:var(--text);}
.obj-toolbar .icon-btn:disabled{opacity:.4;cursor:not-allowed;}
.obj-toolbar .icon-btn.primary{color:var(--accent);}
.obj-toolbar .sep{width:1px;background:var(--border);margin:4px 6px;}
.obj-body{flex:1;min-height:0;display:flex;}
.obj-list{flex:1;min-width:0;overflow:auto;padding:2px 0;}
.obj-group-title{padding:8px 12px 3px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;position:sticky;top:0;background:var(--panel);z-index:1;border-top:1px solid var(--border-2);}
.obj-group-title:first-child{border-top:0;}
.obj-group-title .count{color:var(--faint);font-weight:500;font-size:10px;padding:1px 6px;background:var(--panel-2);border-radius:8px;}
.obj-item{display:flex;align-items:center;gap:8px;padding:4px 14px;cursor:pointer;font-size:13px;border-left:3px solid transparent;}
.obj-item:hover{background:var(--hover);}
.obj-item.sel{background:var(--accent-soft);border-left-color:var(--accent);color:var(--text);}
.obj-item .ico{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.obj-item .obj-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.obj-item .obj-meta{color:var(--faint);font-size:11px;font-family:var(--mono);}
.obj-item.sel .obj-meta{color:var(--muted);}
.obj-db-title{padding:8px 14px 2px;font-size:11px;color:var(--text);font-weight:600;background:var(--panel-2);display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border-2);}
.obj-db-title .db-logo{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;}

/* 右侧详情面板 */
.obj-detail{width:280px;flex:none;overflow:auto;padding:14px;background:var(--panel-2);border-left:1px solid var(--border);}
.obj-detail-empty{text-align:center;color:var(--muted);padding:30px 0;font-size:12px;line-height:1.6;}
.obj-detail-empty .big-logo{width:56px;height:56px;margin:0 auto 10px;display:block;opacity:.4;}
.obj-detail h4{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;}
.obj-detail h4 .big-logo{width:28px;height:28px;flex:none;}
.obj-detail .kind-tag{display:inline-block;padding:2px 8px;font-size:10px;font-weight:700;text-transform:uppercase;border-radius:3px;background:var(--accent);color:#fff;letter-spacing:.5px;}
.obj-detail .field-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;gap:10px;}
.obj-detail .field-row .lbl{color:var(--muted);flex:none;}
.obj-detail .field-row .val{color:var(--text);font-weight:500;text-align:right;word-break:break-all;}
.obj-detail .field-row .val.mono{font-family:var(--mono);font-size:11px;}
.obj-detail .detail-actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.obj-detail .detail-actions .btn{flex:1;padding:6px 8px;font-size:12px;justify-content:center;}
.tabbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);}

/* ===================== 数据工作区 ===================== */
.ws{flex:1;min-height:0;display:flex;flex-direction:column;}
.sub{display:flex;border-bottom:1px solid var(--border);background:var(--bar);flex:none;}
.sub .t{padding:7px 13px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--border);color:var(--text);}
.sub .t:hover{background:var(--panel-2);}
.sub .t.on{background:var(--panel);font-weight:600;box-shadow:inset 0 2px 0 var(--accent);}
.sub .tools{margin-left:auto;display:flex;gap:6px;padding:4px 8px;align-items:center;}
.sub .tools input{padding:4px 8px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;width:70px;background:var(--panel-2);color:var(--text);}

.grid-wrap{flex:1;min-height:0;display:flex;flex-direction:column;}
.grid-scroll{flex:1;overflow:auto;position:relative;background:var(--panel);}
/* 底部操作栏：数据网格下方，固定高度，操作始终可见 */
.grid-toolbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;border-top:1px solid var(--border);background:var(--bar);}
.grid-toolbar .gt-left,.grid-toolbar .gt-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.grid-toolbar .gt-sep{width:1px;height:18px;background:var(--border-2);margin:0 4px;}
.grid-toolbar input{padding:3px 8px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;width:64px;background:var(--panel-2);color:var(--text);}
.grid-toolbar .btn{padding:3px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.grid-toolbar .btn:hover{background:var(--sel);}
.grid-toolbar .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.grid-toolbar .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
/* 待提交单元格高亮 */
td.dirty-cell{background:rgba(255,200,60,.14) !important;}
/* 新增待编辑行：底部带蓝色虚线 + 闪烁动画提示 */
tr.pending{background:rgba(85,180,255,.14);}
tr.pending td:first-child{border-left:3px solid var(--accent);}
tr.pending:hover{background:rgba(85,180,255,.2);}
tr.flash-pending{animation:flashPending 1.2s ease-out 2;}
@keyframes flashPending{0%,100%{background:rgba(85,180,255,.14);}50%{background:rgba(85,180,255,.5);}}
/* 滚动条始终可见（网格内容多时底部滚动条不隐藏） */
.grid-scroll::-webkit-scrollbar{width:11px;height:11px;}
.grid-scroll::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;border:2px solid var(--panel);}
.grid-scroll::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.grid-scroll::-webkit-scrollbar-corner{background:var(--panel);}
.grid-scroll{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent;}
table{border-collapse:separate;border-spacing:0;width:100%;}
thead th{position:sticky;top:0;background:var(--head);z-index:3;border-bottom:1px solid var(--border-2);text-align:left;padding:7px 11px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:12.5px;color:var(--text);}
thead th:hover{background:var(--head-2);}
thead th .ct{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px;}
thead th .arrow{color:var(--accent);margin-left:3px;}
thead th .ficon{color:var(--muted);cursor:pointer;margin-left:5px;font-size:11px;user-select:none;padding:1px 3px;border-radius:4px;}
thead th .ficon:hover{background:var(--panel-2);color:var(--text);}
thead th .ficon.on{color:#fff;background:var(--accent);}
thead th.nosort{cursor:default;}
thead th .resizer{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:4;}
thead th .resizer:hover{background:var(--accent);opacity:.5;}
thead th.resizing{user-select:none;}
tbody td .cell-hl{background:var(--warn);color:#fff;border-radius:2px;padding:0 2px;}
tbody td.gf-hl{outline:2px solid var(--warn);outline-offset:-1px;background:var(--warn-soft,var(--panel-2));}
.grid-findbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--border);flex:none;}
.grid-findbar input{flex:1;max-width:280px;padding:5px 9px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--text);}
.grid-findbar .btn{padding:4px 9px;}
.fpanel{position:fixed;z-index:300;background:var(--panel);border:1px solid var(--border-2);border-radius:9px;box-shadow:var(--shadow);padding:10px 12px;min-width:250px;font-size:12.5px;}
.fpanel .fp-title{font-weight:600;margin-bottom:8px;color:var(--text);}
.fpanel .fp-row{display:flex;gap:6px;margin-bottom:8px;}
.fpanel select,.fpanel input{padding:5px 7px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--text);}
.fpanel .fp-val{flex:1;}
.fpanel .fp-acts{display:flex;gap:6px;justify-content:flex-end;}
.fpanel .fp-vals{margin-top:9px;border-top:1px solid var(--border);padding-top:7px;}
.fpanel .fp-vhint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:5px;}
.fpanel .fp-vlist{max-height:130px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px;}
.fpanel .fp-val-item{padding:2px 8px;border:1px solid var(--border-2);border-radius:9px;font-size:11px;cursor:pointer;background:var(--panel-2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fpanel .fp-val-item:hover{background:var(--sel);border-color:var(--accent);}
.filter-chips{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel-2);border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:12px;}
.fc-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-d);border-radius:9px;padding:2px 9px;font-size:11.5px;}
.fc-chip .fc-x{cursor:pointer;font-size:10px;opacity:.7;}
.fc-chip .fc-x:hover{opacity:1;color:var(--danger);}
thead tr.filter-row td{position:sticky;top:33px;background:var(--panel-2);z-index:2;padding:3px 5px;border-bottom:1px solid var(--border);}
thead tr.filter-row select{width:100%;font-size:11px;padding:1px 2px;border:1px solid var(--border-2);border-radius:4px;margin-bottom:2px;background:var(--panel);color:var(--text);}
thead tr.filter-row input{width:100%;box-sizing:border-box;padding:2px 5px;border:1px solid var(--border-2);border-radius:4px;font-size:12px;background:var(--panel);color:var(--text);}
tbody td{border-bottom:1px solid var(--grid-line);padding:5px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell;max-width:360px;font-size:12.5px;}
tbody td:hover{box-shadow:inset 0 0 0 1px var(--accent);}
tbody tr:nth-child(even){background:var(--row-alt);}
tbody tr:hover{background:var(--sel-soft);}
tbody tr.sel{background:var(--sel)!important;}
tbody tr.sel td{background:transparent;}
tbody td.null{color:var(--null);font-style:italic;}
tbody td.pk{background:var(--pk);}
tbody td.editing{padding:0 3px;}
tbody td.editing input{width:100%;box-sizing:border-box;border:2px solid var(--accent);padding:4px 6px;font-size:12.5px;outline:none;background:var(--panel);color:var(--text);}
.rownum{color:var(--muted);text-align:right;width:46px;background:var(--head);position:sticky;left:0;cursor:pointer;user-select:none;font-size:11.5px;z-index:1;border-right:1px solid var(--border-2);}
.pending-row td{background:var(--ok-soft);}
.pending-row .savecell{padding:4px 6px;}
.pending-row input{width:100%;box-sizing:border-box;border:1px solid var(--border-2);border-radius:4px;padding:3px 5px;background:var(--panel);color:var(--text);}

/* ===================== 查询编辑器 ===================== */
.editor-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);}
.editor-bar{display:flex;gap:7px;align-items:center;padding:7px 10px;background:var(--bar);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.editor-bar .btn{background:var(--panel);}
.editor-bar .btn.primary{background:var(--accent);color:#fff;}
.editor-bar .grow{flex:1;}
/* CodeMirror 5 查询编辑器 */
.ed-cm{flex:1;min-height:0;overflow:hidden;background:var(--panel-2);}
.ed-cm .CodeMirror{height:100%;font:13px/1.6 var(--mono);background:var(--panel-2);color:var(--text);}
.ed-cm .CodeMirror-gutters{background:var(--head);border-right:1px solid var(--border);}
.ed-cm .CodeMirror-linenumber{color:var(--muted);}
.ed-cm .CodeMirror-cursor{border-left:1px solid var(--text);}
.ed-cm .CodeMirror-selected{background:var(--sel);}
.ed-cm .CodeMirror-activeline-background{background:var(--row-alt);}
.ed-cm .CodeMirror-matchingbracket{color:var(--accent);}
.ed-cm .cm-keyword{color:var(--h-kw);font-weight:600;}
.ed-cm .cm-string{color:var(--h-str);}
.ed-cm .cm-number{color:var(--h-num);}
.ed-cm .cm-comment{color:var(--h-cmt);font-style:italic;}
.ed-cm .cm-builtin{color:var(--h-fn);}
/* 提示弹窗：对齐之前自研 hint-pop 风格（CodeMirror 弹窗挂在 body 下，用全局选择器+双类提高特异性确保覆盖默认样式） */
.CodeMirror-hints.CodeMirror-hints{
  background:var(--panel);
  border:1px solid var(--border-2);
  border-radius:7px;
  box-shadow:var(--shadow);
  max-height:250px;
  min-width:220px;
  overflow-y:auto;
  font-size:12px;
  z-index:300;
  padding:5px 0;
  font-family:inherit;
  list-style:none;
}
.CodeMirror-hint.CodeMirror-hint{
  display:flex;
  align-items:center;
  gap:9px;
  padding:4px 11px;
  margin:0;
  cursor:pointer;
  color:var(--text);
  border:none;
  border-radius:0;
  white-space:nowrap;
}
li.CodeMirror-hint-active{background:var(--sel);color:var(--text);}
.htag{
  display:inline-block;
  font-size:10px;
  padding:0 6px;
  border-radius:9px;
  color:#fff;
  flex:none;
  line-height:16px;
}
.htag.关键字{background:#7c3aed;}
.htag.表{background:#2f7ce0;}
.htag.列{background:#2f9e54;}
.htag.函数{background:#d99100;}
.res{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--border);}
.res .sub{display:flex;border-bottom:1px solid var(--border);background:var(--bar);}
.res .sub .t{padding:7px 13px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--border);}
.res .sub .t.on{background:var(--panel);font-weight:600;box-shadow:inset 0 2px 0 var(--accent);}
.res .body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
.msg{font:12px/1.55 var(--mono);padding:9px 13px;white-space:pre-wrap;color:var(--text);}
.msg .ok{color:var(--ok);} .msg .err{color:var(--danger);}
.hist{list-style:none;margin:0;padding:6px 0;}
.hist li{padding:6px 13px;cursor:pointer;border-bottom:1px solid var(--grid-line);font:12px/1.4 var(--mono);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist li:hover{background:var(--sel-soft);}
.plan-pre{font:12px/1.5 var(--mono);white-space:pre;padding:11px;color:var(--text);background:var(--panel-2);}
.plan-tree{font:12px/1.5 var(--mono);padding:10px 14px;color:var(--text);}
.plan-tree .pn{padding:2px 0;}
.plan-tree .lv{color:var(--faint);}
.plan-tree .est{color:var(--accent);}

/* SQL 提示 */
.hint-pop{position:absolute;z-index:50;background:var(--panel);border:1px solid var(--border-2);border-radius:7px;box-shadow:var(--shadow);max-height:250px;overflow:auto;min-width:210px;font-size:12px;}
.hint-pop .it{padding:4px 11px;cursor:pointer;display:flex;gap:9px;align-items:center;}
.hint-pop .it.on{background:var(--sel);}
.hint-pop .it .tag{font-size:10px;padding:0 6px;border-radius:9px;color:#fff;}
.tag.kw{background:#7c83ff;} .tag.tbl{background:#2f9e54;} .tag.col{background:#d99100;} .tag.fn{background:#9b59b6;}

/* 查找替换面板 */
.findbar{position:absolute;right:14px;top:8px;z-index:40;background:var(--panel);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow);padding:9px 11px;display:none;flex-direction:column;gap:6px;width:300px;}
.findbar.show{display:flex;}
.findbar .row{display:flex;gap:6px;align-items:center;}
.findbar input{flex:1;padding:5px 8px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--text);}
.findbar .row .btn{padding:4px 9px;}
/* 查询页库/Schema 下拉 */
.qdb-sel{padding:4px 8px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--text);max-width:160px;}
.qdb-sel:disabled{opacity:.5;cursor:not-allowed;}

/* ===================== 设计器 ===================== */
.design{flex:1;overflow:auto;display:flex;flex-direction:column;}
.design .dh{padding:11px 14px;font-weight:600;border-bottom:1px solid var(--border);background:var(--bar);display:flex;align-items:center;gap:10px;}
.design .dh .acts{margin-left:auto;display:flex;gap:6px;}
.design table{width:100%;}
.design td,.design th{border-bottom:1px solid var(--grid-line);padding:5px 8px;text-align:left;font-size:12.5px;background:var(--panel);}
.design th{background:var(--head);position:sticky;top:0;}
.design input,.design select{width:100%;padding:4px 6px;border:1px solid var(--border-2);border-radius:5px;font-size:12px;background:var(--panel-2);color:var(--text);}
.design .ddl{background:#0f1117;color:#c8e1ff;font:12px/1.5 var(--mono);padding:12px;white-space:pre;overflow:auto;flex:1;}

/* ER */
.er-wrap{flex:1;overflow:auto;background:var(--panel-2);position:relative;}
.er-wrap svg{display:block;}
.er-box{fill:var(--panel);stroke:var(--border-2);stroke-width:1.2;}
.er-title{fill:var(--accent-d);font:600 12px -apple-system,sans-serif;}
.er-col{fill:var(--text);font:11px var(--mono);}
.er-pk{fill:var(--warn);}
.er-link{stroke:var(--accent);stroke-width:1.4;fill:none;opacity:.7;}

/* 监控/角色通用表 */
.gridtbl{flex:1;overflow:auto;padding:0;}
.gridtbl table{width:100%;}
.gridtbl th{position:sticky;top:0;background:var(--head);border-bottom:1px solid var(--border-2);padding:7px 11px;text-align:left;font-size:12px;cursor:pointer;}
.gridtbl td{padding:5px 11px;border-bottom:1px solid var(--grid-line);font-size:12px;white-space:nowrap;}
.gridtbl tr:nth-child(even) td{background:var(--row-alt);}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;}
.badge.y{background:var(--ok-soft);color:var(--ok);} .badge.n{background:var(--danger-soft);color:var(--danger);}

/* 状态栏 */
.statusbar{border-top:1px solid var(--border);background:var(--bar);padding:5px 12px;font-size:12px;color:var(--muted);display:flex;gap:18px;align-items:center;flex:none;}
.statusbar .ok{color:var(--ok);} .statusbar .err{color:var(--danger);} .statusbar .sp{flex:1;}

/* 右键菜单 */
.ctx{position:fixed;z-index:100;background:var(--panel);border:1px solid var(--border-2);border-radius:7px;box-shadow:var(--shadow);min-width:190px;padding:5px 0;font-size:12.5px;}
.ctx .it{padding:7px 15px;cursor:pointer;display:flex;gap:9px;align-items:center;color:var(--text);}
.ctx .it:hover{background:var(--sel);}
.ctx .it.danger{color:var(--danger);} .ctx .it.danger:hover{background:var(--danger-soft);}
.ctx .it.dis{color:var(--faint);cursor:default;} .ctx .it.dis:hover{background:transparent;}
.ctx .sep{height:1px;background:var(--border);margin:5px 0;}

/* 模态 */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:200;}
.modal.show{display:flex;}
.modal .card{background:var(--panel);width:460px;max-width:93vw;border-radius:11px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);}
.modal h3{margin:0 0 14px;font-size:15px;color:var(--text);}
.field{margin-bottom:11px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--border-2);border-radius:7px;font-size:13px;background:var(--panel-2);color:var(--text);}
.field textarea{font:12px/1.5 var(--mono);min-height:120px;resize:vertical;}
.field .err{color:var(--danger);font-size:11px;margin-top:3px;}
.field .note{color:var(--muted);font-size:11px;margin-top:3px;}
.modal .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px;}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;flex-direction:column;gap:8px;}
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><span class="dot"></span> DBNest <span style="opacity:.7;font-weight:400;">库巢 · 数据库管理工具</span></div>
    <div class="sp"></div>
    <button class="tbtn" id="tTheme">🌓 主题</button>
  </div>
  <div class="loadbar" id="loadbar"></div>
  <div class="menubar">
    <div class="mi" data-menu="file">文件</div>
    <div class="mi" data-menu="conn">连接</div>
    <div class="mi" data-menu="query">查询</div>
    <div class="mi" data-menu="view">视图</div>
    <div class="mi" data-menu="tool">工具</div>
    <div class="mi" data-menu="help">帮助</div>
  </div>
  <div class="toolbar" id="toolbar">
    <span class="i" id="i1"></span>
  </div>
  <div class="layout">
    <aside class="left">
      <div class="lf"><input id="treeFilter" placeholder="筛选对象（表/视图名）…" /><button class="btn icon" id="btnRefreshTree" title="刷新对象树">🔄</button></div>
      <div class="tree" id="objTree"></div>
    </aside>
    <main class="main">
      <div class="tabbar" id="tabbar"></div>
      <div class="tabbody" id="tabbody"><div class="empty">请先「新建连接」并打开表 / 新建查询<svg width="40" height="40" opacity=".3"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></div>
    </main>
  </div>
  <div class="statusbar" id="statusbar"><span>就绪</span><span class="sp"></span><span id="sbConn"></span><span id="sbBuild" style="font-size:11px;color:var(--faint);"></span></div>

  <div class="ctx" id="ctxmenu" style="display:none;"></div>

  <div class="modal" id="connModal">
    <div class="card" style="width:560px;">
      <h3>新建连接</h3>
      <div id="cSavedList" style="margin-bottom:12px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--panel-2);"></div>
      <div class="field"><label>数据库类型</label><select id="cType"></select><div class="note" id="cTypeNote"></div></div>
      <div id="cFields"></div>
      <div class="field"><label><input type="checkbox" id="cRo" style="width:auto;display:inline;margin-right:6px;" />只读模式（禁止任何写入）</label></div>
      <div class="err" id="cErr"></div>
      <div class="actions">
        <button class="btn" id="cCancel">取消</button>
        <button class="btn" id="cTest">测试连接</button>
        <button class="btn primary" id="cSave">保存并连接</button>
      </div>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="card" style="width:520px;">
      <h3>⚙ 客户端设置</h3>
      <div class="field" style="display:flex;align-items:center;gap:8px;">
        <label style="margin:0;display:flex;align-items:center;gap:7px;"><input type="checkbox" id="sWebEnabled" style="width:auto;display:inline;margin:0;" />启用 Web 访问服务</label>
        <span class="note" style="margin:0;">开启后可通过浏览器 / 局域网访问本客户端（功能与桌面一致）</span>
      </div>
      <div id="sWebFields">
        <div class="field"><label>监听地址</label><input id="sHost" placeholder="0.0.0.0（所有网卡） / 127.0.0.1（仅本机）" /></div>
        <div class="field"><label>端口</label><input id="sPort" placeholder="5180" /></div>
      </div>
      <div class="note" id="sWebUrl" style="margin-top:2px;"></div>
      <div class="err" id="sErr"></div>
      <div class="actions">
        <button class="btn" id="sCancel">取消</button>
        <button class="btn primary" id="sSave">保存并生效</button>
      </div>
    </div>
  </div>

  <div class="modal" id="importModal">
    <div class="card" style="width:520px;">
      <h3>导入 CSV</h3>      <div class="field"><label>目标表（schema 可选，如 public.mytable）</label><input id="impTable" placeholder="public.new_table" /></div>
      <div class="field"><label>CSV 内容（首行可为表头）</label><textarea id="impCsv" placeholder="id,name,age&#10;1,alice,20&#10;2,bob,30"></textarea></div>
      <div class="field"><label>或从文件选择</label><input type="file" id="impFile" accept=".csv,.txt" /></div>
      <div class="field" style="display:flex;gap:18px;">
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="impHeader" checked style="width:auto;" />首行是表头</label>
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="impCreate" checked style="width:auto;" />表不存在则自动创建</label>
      </div>
      <div class="err" id="impErr" style="color:var(--danger);font-size:11px;"></div>
      <div class="actions">
        <button class="btn" id="impCancel">取消</button>
        <button class="btn primary" id="impRun">开始导入</button>
      </div>
    </div>
  </div>

  <!-- Navicat 式 多条件筛选构建器 -->
  <div class="modal" id="filterModal">
    <div class="card" style="width:640px;">
      <h3>筛选（多条件）</h3>
      <div class="field" style="flex-direction:column;align-items:stretch;gap:6px;">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);">
          <span>条件关系</span>
          <select id="flLogic" style="padding:3px 8px;border:1px solid var(--border-2);border-radius:6px;font-size:12px;background:var(--panel-2);color:var(--text);">
            <option value="AND">满足全部（AND）</option>
            <option value="OR">满足任一（OR）</option>
          </select>
          <button class="btn" id="flAdd" style="margin-left:auto;">＋ 添加条件</button>
        </div>
        <div id="flRows" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;padding:4px;"></div>
      </div>
      <div class="err" id="flErr" style="color:var(--danger);font-size:11px;"></div>
      <div class="actions">
        <button class="btn" id="flClear">清除全部</button>
        <button class="btn" id="flCancel">取消</button>
        <button class="btn primary" id="flApply">应用筛选</button>
      </div>
    </div>
  </div>

  <!-- Navicat 式 数据传输向导 -->
  <div class="modal" id="transferModal">
    <div class="card" style="width:620px;">
      <h3>数据传输（Navicat 式）</h3>
      <div class="field"><label>源连接</label><select id="trSrcConn"></select></div>
      <div class="field"><label>源数据库</label><select id="trSrcDb"></select></div>

/* ===== PII 脱敏：按列名识别敏感字段，网格/结果集显示掩码（title 悬停可看完整值，本地仅展示） ===== */
const PII_PATTERNS = [
  { re: /phone|mobile|tel|手机|电话/i, label: '手机', mask: (v) => String(v).replace(/^(.{3}).*(.{2})$/, '$1****$2') },
  { re: /id_card|identity|idno|证件|身份证/i, label: '证件', mask: (v) => String(v).replace(/^(.{4}).*$/, '$1********') },

  { re: /name|姓名/i, label: '姓名', mask: (v) => String(v).replace(/^(.{1}).*$/, '$1*') },
  { re: /bank|card_no|卡号/i, label: '卡号', mask: (v) => String(v).replace(/^(.{4}).*$/, '$1 **** ****') },
];
function piiInfo(colName) {
  const hit = PII_PATTERNS.find((p) => p.re.test(colName || ''));
  return hit || null;
}
// PII 脱敏开关（localStorage 记忆）：true=脱敏显示(默认) / false=显示原始值
function piiMasked() { return localStorage.getItem('wb_pii_mask') !== '0'; }

function refreshAllDataTabs() {

}
function maskPii(colName, value) {
  if (!piiMasked()) return value;
  const p = piiInfo(colName);
  if (!p || value == null || value === '') return value;
  const s = String(value);
  if (s.length < 5) return s;
  return p.mask(s);
}

function stripBrandPrefix(name, type) {

  // 同时移除当前 type + 已知 brands

/* ===== 凭据保险库：主密码(不落盘) → PBKDF2 → AES-GCM 加密保存的连接密码 ===== */
const LS_VAULT = 'wb_vault';           // { salt, verifier }
const SS_VAULT_KEY = 'wb_vault_key';   // sessionStorage 派生密钥（会话级）
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function vaultConfig() { try { return JSON.parse(localStorage.getItem(LS_VAULT)) || null; } catch (_) { return null; } }
function vaultHasKey() { try { return !!sessionStorage.getItem(SS_VAULT_KEY); } catch (_) { return false; } }
async function vaultDerive(master, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(master), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' }, km,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function vaultAes(key, plain) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plain));
  return { v: 1, iv: b64(iv), ct: b64(ct) };
}
async function vaultAesDec(key, payload) {
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(payload.iv) }, key, unb64(payload.ct));
    return new TextDecoder().decode(pt);
  } catch (_) { return null; }
}
// 设置/修改主密码
async function vaultSet(master) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await vaultDerive(master, salt);

async function api(path, body) {

  if (window.dbAdminBridge) {
    try {
      const r = await window.dbAdminBridge.api(path, body);
      if (r && r.status && r.status !== 200) {
        const msg = (r.data && r.data.error) || ('状态 ' + r.status);
        if (body.connId && /连接不存在|已断开|socket hang up|ECONNRESET|read ECONN/i.test(msg)) {
          const ncId = await reconnOnce(body.connId);
          if (ncId) { body.connId = ncId; return api(path, body); }
        }
        loadingEnd(task);
        throw new Error(msg);
      }
      loadingEnd(task);
      return r && r.data;
    } catch (e) {
      if (body.connId && /连接不存在|已断开|socket hang up|ECONNRESET|fetch failed/i.test(String(e.message))) {
        const ncId = await reconnOnce(body.connId);
        if (ncId) { body.connId = ncId; return api(path, body); }
      }
      loadingEnd(task);
      throw e;
    }
  }
  // 断线自动重连：若请求的连接已失效（服务器重启/连接被回收），用已保存配置自动重连一次并重试
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        const msg = j.error || ('HTTP ' + r.status);
        if (attempt === 0 && body.connId && /连接不存在|已断开|socket hang up|ECONNRESET|read ECONN/i.test(msg)) {
          const ncId = await reconnOnce(body.connId);
          if (ncId) { body.connId = ncId; continue; } // 用新 connId 重试本次请求
        }
        loadingEnd(task);
        throw new Error(msg);
      }
      loadingEnd(task);
      return j;
    } catch (e) {
      if (attempt === 0 && body.connId && /连接不存在|已断开|socket hang up|ECONNRESET|fetch failed/i.test(String(e.message))) {
        const ncId = await reconnOnce(body.connId);
        if (ncId) { body.connId = ncId; continue; }

      loadingEnd(task);

    }
  }

// 轻量 SQL 格式化：大写关键字 + 主子句换行（保留占位符 $1 $2 等）
function formatSqlLite(sql) {
  if (!sql) return '';
  const KW = ['SELECT','FROM','WHERE','AND','OR','NOT','JOIN','LEFT','RIGHT','INNER','OUTER','ON','GROUP BY','ORDER BY','HAVING','LIMIT','OFFSET','UNION','INTERSECT','EXCEPT','INSERT','UPDATE','SET','VALUES','DELETE','INTO','RETURNING','WITH','CASE','WHEN','THEN','ELSE','END','AS','CONFLICT','USING','DROP','CREATE','ALTER','TRUNCATE','TABLE','DATABASE','INDEX','VIEW','REPLACE','FUNCTION','PROCEDURE','OR REPLACE','CASCADE','RESTRICT'];
  let s = sql;
  // 大写关键字（避免改占位符 $1）
  s = s.replace(/\b([a-zA-Z_]+)\b/g, (m) => KW.includes(m.toUpperCase()) ? m.toUpperCase() : m);
  // 主子句前换行
  s = s.replace(/\s*\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|UNION ALL|UNION|INTERSECT|EXCEPT|RETURNING|ON CONFLICT|SET|VALUES|INNER JOIN|LEFT JOIN|RIGHT JOIN|FULL JOIN|LEFT OUTER JOIN|RIGHT OUTER JOIN|JOIN)\b/g, (m) => '\n' + m.trim().toUpperCase());
  s = s.replace(/\n{2,}/g, '\n').trim();
  if (s && !s.endsWith(';')) s += ';';
  return s;
}

  else if (t.kind === 'roles') renderRolesTab(t, body);
  else if (t.kind === 'audit') renderAuditTab(t, body);

// 树节点点击 → 联动对象面板（Navicat 行为：点连接/库/表/视图/函数，对象面板跟随显示对应库与类型）
// kind: conn(连接) | db(库) | table | view | function | sequence
function treePick(conn, kind, dbName, schema, table) {
  pickNoJump(conn, kind, dbName, schema, table);
  // treePick 额外：强制切到对象 Tab（点连接/库/分组父节点等需要看到对象面板）
  state.activeTabId = '_objects';
  renderTabbar();
  renderTabBody();
  // 点击表/视图/函数/序列 → 滚动到对象列表对应行并平滑居中
  if (kind !== 'conn' && kind !== 'db') {
    setTimeout(() => {
      const target = document.querySelector('#objList .obj-item.sel');
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 30);
  }
}
// 联动对象面板状态 + 渲染（不强制切 Tab，供「单击具体表打开数据」场景使用）
function pickNoJump(conn, kind, dbName, schema, table) {
  state.activeConnId = conn.connId;
  if (kind === 'conn') {
    state._objDb = conn.database || '';
    state._objType = state._objType || 'table';
    state._objSel = null; state._objSelList = [];
  } else if (kind === 'db') {
    state._objDb = dbName;
    state._objSel = null; state._objSelList = [];
    state._objType = state._objType || 'table';
  } else {
    // 表/视图/函数/序列：联动到所属库 + 按节点类型切换对象面板 Tab
    state._objDb = dbName || conn.database || '';
    state._objType = kind === 'table' ? 'table' : kind === 'view' ? 'view' : kind === 'function' ? 'function' : 'sequence';
    // 从 conn.meta 取真实对象（含 columns/PK/args 等），否则详情面板显示不完整
    const meta = (conn.meta && conn.meta.databases || []).find((d) => d.name === state._objDb);
    const realObj = (meta && meta.schemas || []).flatMap((s) =>
      [].concat(s.tables || [], s.views || [], s.functions || [], s.sequences || [])
    ).find((o) => o.name === table) || { name: table };
    state._objSel = { connId: conn.connId, db: state._objDb, schema: schema || 'public', table: table, kind: kind, obj: realObj };
    state._objSelList = [];
  }
  // 记录最近点击的节点（新建查询跟随）
  state._lastPick = { connId: conn.connId, kind, db: state._objDb, schema: schema || '', table: table || '' };
  renderConnInfo();
  renderObjNav();
}

// 对象导航面板（Navicat 风格：连接信息条 + 工具栏 + 分组列表 + 右侧详情）

      const vC = (dbNode ? dbNode.schemas : []).reduce((n, s) => n + (s.views || []).length, 0);
      const fC = (dbNode ? dbNode.schemas : []).reduce((n, s) => n + (s.functions || []).length, 0);
      const sC = (dbNode ? dbNode.schemas : []).reduce((n, s) => n + (s.sequences || []).length, 0);

// 右侧详情面板
function renderObjDetail(conn) {

      cols.slice(0, 12).forEach((c) => {
        html += '<div class="field-row"><span class="lbl">' + esc(c.name) + (c.pk ? ' <span style="color:var(--accent);font-size:9px;">PK</span>' : '') + '</span><span class="val mono">' + esc(c.type || '') + '</span></div>';
      });
      if (cols.length > 12) html += '<div class="field-row"><span class="lbl" style="color:var(--muted);">… 共 ' + cols.length + ' 列</span><span></span></div>';
      html += '</div>';
    }
  } else if (isFunc) {
    html += row('参数', obj.args || '()');
    html += row('返回类型', obj.returnType || '未知');
    if (obj.lang) html += row('语言', obj.lang);
  } else if (isSeq) {
    html += row('数据类型', obj.dataType || '未知');
    html += row('起始值', obj.start || '1');
  }
  // 路径 + 操作按钮
  html += '<div class="field-row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);"><span class="lbl">位置</span><span class="val mono" style="font-size:10px;">' + esc(sel.db + '.' + sel.schema + '.' + sel.table) + '</span></div>';
  html += '<div class="detail-actions">';
  if (isTable || isView) {
    html += '<button class="btn primary" id="odOpen">📋 打开</button>';
    html += '<button class="btn" id="odDesign">🛠 设计</button>';
  } else {
    html += '<button class="btn primary" id="odOpen">查看定义</button>';
  }
  html += '<button class="btn" id="odCopy" title="复制名称">📋</button>';
  html += '</div>';
  return html;
}
function row(lbl, val) {

}

// 打开表：PG 族若表属于非当前连接库，先建该库独立连接（否则 "库"."表" 被当 schema 报错）
async function openTable(conn, schema, table, isView, dbName) {
  let queryConnId = conn.connId;
  // PG 族：dbName 是该库名（树库节点），与连接当前库不同 → connect-db
  const isPg = conn.type === 'postgresql' || conn.type === 'postgres' || conn.type === 'opengauss';
  const useDb = isPg && dbName && dbName !== conn.database;
  if (useDb) {
    try {
      const rc = await api('/api/connect-db', { connId: conn.connId, db: dbName });
      queryConnId = rc.connId;
      if (!state.connections.find((x) => x.connId === rc.connId)) {
        state.connections.push({ ...conn, connId: rc.connId, database: dbName, name: conn.name.split('@')[0] + ' @' + dbName, meta: conn.meta, real: true, mysql: conn.mysql, mongo: conn.mongo, type: conn.type });
      }
    } catch (e) { flash('连接库 ' + dbName + ' 失败：' + e.message, true); return; }
  }
  // MySQL：schema 即库名（树里平铺），full 用 `库.表` 全限定——不依赖连接默认库（连接时未选库也能打开表）
  // SQLite：无库概念，裸表名；PG：schema.table
  const full = conn.type === 'sqlite' ? table : (schema + '.' + table);
  const existing = state.tabs.find((t) => t.kind === 'data' && t.queryConnId === queryConnId && t.full === full);
  if (existing) { state.activeTabId = existing.id; renderTabbar(); renderTabBody(); return; }
  const t = newTab({ kind: 'data', title: (isView ? '视图 ' : '表 ') + full, connId: conn.connId, queryConnId, schema, table, db: useDb ? dbName : conn.database, full, isView: !!isView, sub: 'data', columns: [], rows: [], viewRows: [], filters: [], sort: null, limit: 1000, offset: 0, page: 1, pkCols: [], pending: null, selRow: -1, total: null, allLoaded: false, colOrder: null, fks: [] });
  await loadTableData(t);
}
async function loadTableData(t) {
  // 等所有在途单元格保存完成再查询（避免编辑后点刷新读到旧值）
  if (t._saveQueue) { try { await t._saveQueue; } catch (_) {} }
  // 恢复持久化筛选（首次打开该表时）
  if (!t._filtersLoaded) {
    t._filtersLoaded = true;
    try {
      const key = 'wb_filters_' + t.connId + '_' + t.full;
      const saved = JSON.parse(localStorage.getItem(key) || '[]');
      if (saved && saved.length) { t.filters = saved; if (state.activeTabId === t.id) { refreshActiveTabChips(); } }
    } catch (_) {}
  }
  const conn = getConn(t.connId);
  const isPg = conn.type === 'postgresql' || conn.type === 'postgres' || conn.type === 'opengauss';
  t._isPg = isPg;
  const sch = (conn.meta && conn.meta.databases[0].schemas.find((s) => s.name === t.schema)) || { tables: [] };
  const tblMeta = (sch.tables || []).find((x) => x.name === t.table) || (sch.views || []).find((x) => x.name === t.table);
  // 主键信息：优先本地 meta；跨库表（如 ai_calendar.sys_application 不在 tao_db 的 meta 里）需从查询连接取 table-def
  let pkFromDef = null;
  if (tblMeta) {
    t.pkCols = tblMeta.columns.filter((c) => c.pk).map((c) => c.name);
  } else if (!t.pkCols || !t.pkCols.length) {
    try {
      const def = await api('/api/table-def', { connId: t.queryConnId || t.connId, schema: t.schema, table: t.table });
      pkFromDef = def.pk || [];
      t.pkCols = pkFromDef;
    } catch (_) { t.pkCols = []; }
  }
  // 无主键提示：PG 用 ctid、MySQL/SQLite 用全列值定位，都可编辑；仅不可安全定位时受限
  if (!t.pkCols.length && !t.isView) {
    setStatus(isPg ? ('ℹ ' + esc(t.full) + ' 无主键：以行定位(ctid)编辑') : ('ℹ ' + esc(t.full) + ' 无主键：以全列值匹配编辑（重复行可能影响多行）'));
  }
  // 稳定排序：用户排序优先；其次主键；PG 无主键用 ctid、SQLite 用 rowid、MySQL 无主键不加 ORDER BY（InnoDB 主键序稳定）；视图用首列
  let orderBy = t.sort ? { columns: [t.sort.column], dir: t.sort.dir } : null;
  if (!orderBy) {
    if (t.pkCols && t.pkCols.length) orderBy = { columns: t.pkCols, dir: 'ASC' };
    else if (!t.isView) {
      if (conn.mysql) orderBy = null; // MySQL 无主键不加 ORDER BY
      else orderBy = conn.type === 'sqlite' ? { columns: ['rowid'], dir: 'ASC', raw: true } : { columns: ['ctid'], dir: 'ASC', raw: true };
    }
    else if (tblMeta && tblMeta.columns && tblMeta.columns.length) orderBy = { columns: [tblMeta.columns[0].name], dir: 'ASC' };
  }
  // PG 无主键表：SELECT 附加 ctid（物理行定位），供编辑/删除使用（Navicat 同款方案）
  const needCtid = !t.isView && isPg && !t.pkCols.length;
  const sel = UI.buildSelect(t.full, { columns: needCtid ? ['*', 'ctid'] : null, where: t.filters, whereLogic: t._filterLogic, orderBy, limit: t.limit, offset: (t.page - 1) * t.limit });
  setStatus('查询中：' + esc(t.full));
  try {
    const qc = t.queryConnId || t.connId; // 跨库时用目标库连接
    const r = await api('/api/query', { connId: qc, sql: sel.sql, params: sel.params });
    t.columns = r.fields.filter((f) => f.name !== 'ctid').map((f) => ({ name: f.name, type: f.type, pk: t.pkCols.includes(f.name) }));
    t.rows = r.rows; t.viewRows = r.rows.slice();
    t.pending = null; t.selRow = -1; t.selRows = [];
    t.total = await fetchRowCount(conn, t);
    if (!t.fks || !t.fks.length) { try { const def = await api('/api/table-def', { connId: qc, schema: t.schema, table: t.table }); t.fks = def.foreignKeys || []; } catch (_) {} }
    if (state.activeTabId === t.id) renderTabBody();

// 填充 qConn / qDb / qSchema 选项：先选连接 → 再选该连接的库 → schema
// 支持多连接：连接下拉列出所有连接，切换连接后库下拉刷新
function buildQueryContext(t) {
  const dbSel = $('qDb'); const schSel = $('qSchema'); const connSel = $('qConn');
  if (!dbSel || !schSel || !connSel) return;
  // 连接下拉：所有连接（含品牌 logo 标记）
  connSel.innerHTML = state.connections.map((c) => {
    const logo = dbEmoji(c.type) || (DB_LOGOS[String(c.type || '').toLowerCase()] || '');
    return '<option value="' + esc(c.connId) + '"' + (c.connId === t.connId ? ' selected' : '') + '>' + esc(c.name || c.connId) + '</option>';
  }).join('');
  connSel.onchange = () => {
    t.connId = connSel.value; t.db = ''; t.schema = '';
    buildQueryContext(t);
  };
  const conn = getConn(t.connId);
  if (!conn) {
    dbSel.innerHTML = '<option value="">（无连接）</option>';
    schSel.innerHTML = '<option value="">（无 schema）</option>';
    return;
  }
  // 库下拉：当前连接的所有库
  const dbs = (conn.meta && conn.meta.databases) || [];
  const dbNames = dbs.map((d) => d.name);
  const curDb = dbNames.includes(t.db) ? t.db : (dbs.find((d) => d.schemas && d.schemas.length) || dbs[0] || { name: conn.database || '' }).name;
  dbSel.innerHTML = dbNames.map((n) => '<option value="' + esc(n) + '"' + (n === curDb ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
  dbSel.onchange = () => { t.db = dbSel.value; t.schema = ''; buildQueryContext(t); };
  // schema 下拉
  const dbNode = dbs.find((d) => d.name === curDb);
  let schemas = (dbNode && dbNode.schemas) || [];
  if (schemas.length === 1 && schemas[0].name === curDb) schemas = []; // 平铺：MySQL/SQLite
  const schemaNames = schemas.map((s) => s.name);
  const curSchema = schemaNames.includes(t.schema) ? t.schema : (schemaNames[0] || '');
  schSel.innerHTML = (schemaNames.length ? schemaNames.map((n) => '<option value="' + esc(n) + '"' + (n === curSchema ? ' selected' : '') + '>' + esc(n) + '</option>').join('') : '<option value="">（无 schema）</option>');
  schSel.disabled = !schemaNames.length;
  schSel.onchange = () => { t.schema = schSel.value; buildQueryContext(t); };
  t.db = curDb; t.schema = curSchema;
  t.title = '查询' + (conn.name ? ' ' + conn.name.split('@')[0] : '') + (curDb ? ' › ' + curDb : '') + (curSchema ? '.' + curSchema : '');
  const tab = state.tabs.find((x) => x.id === t.id); if (tab) { tab.title = t.title; tab.db = t.db; tab.schema = t.schema; tab.connId = t.connId; renderTabbar(); }

  if (t.cm && t.cm.setOption && !t.cm.isDisposed?.()) {
    try { t.cm.setOption('hintOptions', { hint: bigSqlHint(t.id), completeSingle: false, render: hintRender }); } catch (_) {}
  }
}

/* 大智能提示：关键字 + 表 + 列 + 函数 混排（带分类标签），输入自动弹出 / Ctrl+Space */
function bigSqlHint(tabId) {
  return function (cm, options) {
    const cur = cm.getCursor();
    const line = cm.getLine(cur.line) || '';
    const text = line.slice(0, cur.ch);
    const tab = state.tabs.find((x) => x.id === tabId);
    const conn = getConn((tab && tab.connId) || state.activeConnId);
    const activeDb = (tab && tab.db) || (conn && conn.database) || '';
    const activeSchema = (tab && tab.schema) || '';

    // ── 表别名/表名. → 列补全（如 `t.` / `qcsh_goods.` / `public.qcsh_goods.`）──
    const mDot = text.match(/([A-Za-z_][A-Za-z0-9_]*)\s*\.\s*([A-Za-z_][A-Za-z0-9_]*)?$/);
    if (mDot && text.lastIndexOf('.') >= 0) {
      const qualifier = mDot[1].toLowerCase();
      const prefix = (mDot[2] || '').toLowerCase();
      const aliases = parseTableAliases(cm.getValue());
      const target = aliases[qualifier] || qualifier; // 别名 → 表名；无别名时限定符即表名
      const cols = [];
      if (conn && conn.meta) conn.meta.databases.forEach((db) => {
        if (activeDb && db.name !== activeDb) return;
        db.schemas.forEach((sc) => {
          (sc.tables || []).concat(sc.views || []).forEach((t) => {
            const fullName = (sc.name === db.name ? t.name : sc.name + '.' + t.name).toLowerCase();
            if (target === t.name.toLowerCase() || target === fullName) {
              t.columns.forEach((c) => { if (c.name.toLowerCase().startsWith(prefix)) cols.push({ text: c.name, type: '列' }); });
            }
          });
        });
      });
      const seen2 = new Set();
      const list2 = cols.filter((x) => { const k = x.text; if (seen2.has(k)) return false; seen2.add(k); return true; }).slice(0, 60);
      list2.forEach((x) => { x.render = hintRender; });
      if (!list2.length) return null;
      const fromCh = cur.ch - (mDot[2] ? mDot[2].length : 0);
      return { list: list2, from: CodeMirror.Pos(cur.line, fromCh), to: cur };
    }

    const m = text.match(/([A-Za-z_][A-Za-z0-9_]*)$/);
    if (!m) return null;
    const tok = m[1], low = tok.toLowerCase();
    const kws = SQL_KEYWORDS.filter((k) => k.toLowerCase().startsWith(low)).map((v) => ({ text: v, type: '关键字' }));
    const fns = SQL_FUNCTIONS.filter((f) => f.toLowerCase().startsWith(low)).map((v) => ({ text: v, type: '函数' }));
    const tbl = [], col = [];
    if (conn && conn.meta) conn.meta.databases.forEach((db) => {
      // 限定范围：当前活动的库 / Schema；空字符串表示该库没有 schema 概念（MySQL/SQLite 平铺）
      const dbMatch = !activeDb || db.name === activeDb;
      if (!dbMatch) return;
      db.schemas.forEach((sc) => {
        const schMatch = !activeSchema || sc.name === activeSchema || sc.name === db.name;
        const showPrefix = activeSchema && sc.name !== activeSchema && sc.name !== 'public' && sc.name !== db.name;
        (sc.tables || []).concat(sc.views || []).forEach((t) => {
          if (schMatch && t.name.toLowerCase().startsWith(low)) tbl.push({ text: t.name, type: '表' });
          if (schMatch && showPrefix && t.name.toLowerCase().startsWith(low)) tbl.push({ text: sc.name + '.' + t.name, type: '表' });
          t.columns.forEach((c) => { if (c.name.toLowerCase().startsWith(low)) col.push({ text: c.name, type: '列' }); });
        });
      });
    });
    const seen = new Set();
    const list = [].concat(kws, tbl, col, fns).filter((x) => { const k = x.type + x.text; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 60);
    // 关键：CodeMirror 5 show-hint 源码只调用「每项自己的 render」（u.render ? u.render(a,t,u) : ...），
    // hintOptions.render 配置无效。这里给每项附加 render，类型徽章才能被第三方控件渲染出来。
    list.forEach((x) => { x.render = hintRender; });
    if (!list.length) return null;
    return { list, from: CodeMirror.Pos(cur.line, cur.ch - tok.length), to: cur };
  };
}
// 解析 SQL 中 FROM/JOIN 的表别名映射：{ 别名: 表名 }（支持 FROM t a / FROM t AS a / JOIN schema.t a / db.schema.t）
function parseTableAliases(sql) {
  const map = {};
  const STOP = new Set(['where', 'group', 'order', 'limit', 'having', 'union', 'on', 'join', 'left', 'right', 'inner', 'outer', 'cross', 'as', 'select', 'from', 'offset', 'and', 'or', 'by', 'set', 'values', 'into', 'insert', 'update', 'delete']);
  // 限定名最多三段（db.schema.table），段间允许空格；别名可为 "AS x" 或裸 "x"
  const re = /(?:FROM|JOIN)\s+([A-Za-z_][A-Za-z0-9_]*)(?:\s*\.\s*([A-Za-z_][A-Za-z0-9_]*))?(?:\s*\.\s*([A-Za-z_][A-Za-z0-9_]*))?(?:\s+(?:AS\s+)?([A-Za-z_][A-Za-z0-9_]*))?/gi;
  let m;
  while ((m = re.exec(sql || '')) !== null) {
    const p1 = m[1], p2 = m[2], p3 = m[3], alias = m[4];
    let table = p1;
    if (p2) table = p1 + '.' + p2;
    if (p3) table = p1 + '.' + p2 + '.' + p3;
    if (alias && !STOP.has(alias.toLowerCase())) map[alias.toLowerCase()] = table;
    else map[table.split('.').pop().toLowerCase()] = table; // 无别名时表名本身可作为限定符
  }
  return map;
}

// 通用输入弹窗：返回 Promise<string|null>（确定=输入值,取消/关闭=null）；可带校验
function inputPrompt(title, placeholder, initial, validate) {
  return new Promise((resolve) => {
    $('inTitle').textContent = title || '输入';
    const val = $('inVal');
    val.value = initial || '';
    val.placeholder = placeholder || '请输入…';
    $('inErr').textContent = '';
    $('inputModal').classList.add('show');
    const finish = (ok) => {
      if (ok && validate) {
        const err = validate(val.value);
        if (err) { $('inErr').textContent = err; return; }
      }
      $('inputModal').classList.remove('show');
      resolve(ok ? val.value : null);
    };
    val.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') { finish(false); } };
    $('inOk').onclick = () => finish(true);
    $('inCancel').onclick = () => finish(false);
    setTimeout(() => val.focus(), 30);
  });
}

async function runSyncCompare() {

// Excel 导出：SpreadsheetML 2003 XML（Excel/WPS 双击直接打开，纯文本无需 ZIP，零依赖）
function buildXlsx(cols, rows) {
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cell = (v) => {
    if (v == null || v === '') return '<Cell/>';
    if (typeof v === 'number') return '<Cell><Data ss:Type="Number">' + v + '</Data></Cell>';
    if (typeof v === 'boolean') return '<Cell><Data ss:Type="Boolean">' + (v ? 1 : 0) + '</Data></Cell>';
    return '<Cell><Data ss:Type="String">' + esc(v) + '</Data></Cell>';
  };
  let xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n';
  xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">';
  xml += '<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/></Style></Styles>';
  xml += '<Worksheet ss:Name="Sheet1"><Table>';
  xml += '<Row>' + cols.map((c) => '<Cell ss:StyleID="hdr"><Data ss:Type="String">' + esc(c) + '</Data></Cell>').join('') + '</Row>';
  for (const row of rows) { xml += '<Row>' + cols.map((c) => cell(row[c])).join('') + '</Row>'; }
  xml += '</Table></Worksheet></Workbook>';
  return xml;
}

function genDDL(def) {
  if (!def) return '';
  const lines = def.columns.map((c) => { let s = '  ' + c.name + ' ' + c.type; if (!c.nullable) s += ' NOT NULL'; if (c.default != null) s += ' DEFAULT ' + c.default; return s; });
  if (def.pk && def.pk.length) lines.push('  PRIMARY KEY (' + def.pk.join(', ') + ')');
  return 'CREATE TABLE ' + def.schema + '.' + def.table + ' (\n' + lines.join(',\n') + '\n);';
}
function isNum(v) { return /^-?\d+(\.\d+)?$/.test(String(v)); }
function parseCsvLocal(text) {
  const rows = []; let i = 0, field = '', inQ = false; const n = text.length;
  let row = [];
  while (i < n) { const ch = text[i]; if (inQ) { if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; } field += ch; i++; continue; } if (ch === '"') { inQ = true; i++; continue; } if (ch === ',') { row.push(field); field = ''; i++; continue; } if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; if (text[i] === '\r') i++; continue; } if (ch === '\r') { row.push(field); rows.push(row); row = []; field = ''; i++; if (text[i] === '\n') i++; continue; } field += ch; i++; }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return []; const head = rows[0]; return rows.slice(1).map((r) => { const o = {}; head.forEach((h, k) => o[h] = r[k]); return o; });
}

function renderVaultBar() {
  const bar = $('cVaultBar'); if (!bar) return;
  const cfg = vaultConfig();
  if (!cfg) {
    bar.innerHTML = '<span class="hint">密码保险库未开启（保存的连接密码为明文）</span>' +
      '<button class="btn" id="vSet" style="padding:1px 9px;margin-left:auto;">' + ICON.pencil + '设置主密码</button>';
    const b = $('vSet'); if (b) b.onclick = async () => {
      const p1 = prompt('设置保险库主密码（用于加密保存的连接密码，请牢记，丢失无法找回）：');
      if (!p1) return;
      const p2 = prompt('再次输入确认：');
      if (p1 !== p2) { flash('两次输入不一致', true); return; }
      await vaultSet(p1);
      renderSavedConns(); renderVaultBar();
      flash('保险库已开启，之后保存的连接密码将加密存储', false);
    };
  } else if (!vaultHasKey()) {
    bar.innerHTML = '<span class="hint">保险库已开启但未解锁（自动重连需要解锁）</span>' +
      '<button class="btn primary" id="vUnlock" style="padding:1px 9px;margin-left:auto;">' + ICON.check + '解锁</button>';
    const b = $('vUnlock'); if (b) b.onclick = async () => {
      const p = prompt('输入保险库主密码解锁：');
      if (!p) return;
      const ok = await vaultUnlock(p);
      if (ok) { renderSavedConns(); renderVaultBar(); flash('保险库已解锁', false); }
      else { flash('主密码错误', true); }
    };
  } else {
    bar.innerHTML = '<span class="hint" style="color:var(--ok);">保险库已解锁（密码已加密存储）</span>' +
      '<button class="btn" id="vLock" style="padding:1px 9px;margin-left:auto;">' + ICON.disconnect + '锁定</button>' +
      '<button class="btn" id="vReset" style="padding:1px 9px;">' + ICON.pencil + '改主密码</button>';
    const lk = $('vLock'); if (lk) lk.onclick = () => { try { sessionStorage.removeItem(SS_VAULT_KEY); } catch (_) {} renderVaultBar(); flash('保险库已锁定', false); };
    const rs = $('vReset'); if (rs) rs.onclick = async () => {
      const cur = prompt('输入当前主密码确认：'); if (!cur) return;
      const ok = await vaultUnlock(cur); if (!ok) { flash('主密码错误', true); return; }
      const p1 = prompt('设置新主密码：'); if (!p1) return;
      const p2 = prompt('再次输入确认：'); if (p1 !== p2) { flash('两次输入不一致', true); return; }
      await vaultSet(p1);
      renderVaultBar(); flash('主密码已更新', false);
    };
  }
}

  DBP_RESET[$('cType').value].fields.forEach(([key]) => {

      // 保险库加密的密码不回填明文，用占位提示
      if (c.password && typeof c.password === 'object') { el.value = ''; el.placeholder = '（已加密，重连将使用已保存密码）'; }
      else el.value = c.password || '';
    }
    else if (key === 'user') el.value = c.username || '';
    else if (key === 'database') el.value = c.database || '';
    else if (key === 'host') el.value = c.host || '';
  });
  $('cRo').checked = !!c.readonly;
}

/* ====================== 启动 ====================== */
window.addEventListener('DOMContentLoaded', async () => {
  // 页面刷新/关闭时断开活动连接并清记录（服务端释放连接池）
  // 刷新后启动会通过 restoreLiveConns() 自动重连，体验上「连接还在」
  window.addEventListener('pagehide', () => {
    try {
      if (window.dbAdminBridge) {
        // 桌面 IPC 模式：主进程侧随窗口退出自动回收连接，无需显式断连
        try { window.dbAdminBridge.flush && window.dbAdminBridge.flush(); } catch (_) {}
      } else {
        state.connections.forEach((c) => { try { fetch('/api/disconnect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ connId: c.connId }), keepalive: true }); } catch (_) {} });
      }
      localStorage.removeItem('dbadmin_live');
    } catch (_) {}
  });
  const saved = loadConns();
  if (saved.length) {
    // 1) 恢复刷新前的活动连接（Navicat：刷新保持连接）
    const restored = await restoreLiveConns();
    if (restored > 0) {
      renderTree(); renderTabbar(); renderTabBody();
      setStatus('已恢复 ' + restored + ' 个连接（刷新保持连接）');
    }
    // 2) 其余已保存连接以「未连接」占位（双击连接节点 / 右键「连接」建立连接）
    const liveIds = new Set(state.connections.map((c) => c.connId));
    for (const cfg of saved) {
      if (cfg.connId && liveIds.has(cfg.connId)) continue; // 已恢复的活动连接跳过占位
      state._savedConns = state._savedConns || [];
      state._savedConns.push(cfg);
    }
    if (restored === 0) {
      renderTree();
      renderTabbar();
      renderTabBody();
      setStatus(saved.length + ' 个已保存连接（双击连接节点连接）');
    } else {
      renderTree();
    }
  } else {
    renderSavedConns(); $('connModal').classList.add('show');
    setStatus('请新建连接以直连数据库');
  }
});
</script>
</body>
</html>
